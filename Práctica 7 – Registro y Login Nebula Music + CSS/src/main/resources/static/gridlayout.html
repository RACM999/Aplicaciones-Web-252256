<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Title</title>

    <style>
        .contenedor{
            display: grid;
            grid-template-columns: 200px 200px 200px;
            gap: 10px;
            border:1px;
            padding: 10px;
            background-color: #f9f9f9;
            margin-bottom: 30px;
        }

        .caja-basica{
            height: 100px;
            display: flex;
            justify-content: center;
            border:2px solid blue;
            align-items: center;
            background-color: aquamarine;
            font-weight: bold;

        }
        /*

        Se aplica SOLO cuando el ancho de la pantalla mide 768px o menos
        */


        @media (max-width: 768px){
            .contenedor{
                grid-template-columns: 100px 100px;

            }

            body {
                background-color: blue;


            }

        }

        /*Este se aplica Solo cunado la pantalla mide 768px o mas*/
        @media (min-width: 768px){


            body {
                background-color: aquamarine;


            }

        }


        @media(width >= 768px){


        }

        @media(425px < width < 768px){


        }



        .parent{
            display: grid;
            grid-template-columns:repeat(4, 1fr) ;
            grid-template-rows: repeat(4, 100px);
            gap: 5px;
            max-width: 500px;
            border: 1px solid black;
            padding: 5px;
            background-color: #f0f0f0;


        }

        .parent div{
            background-color: #ffe4b5;
            border: 1px solid black;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;

        }

        .div1{
            grid-area: 1/1/3/2;

        }

        .div2{
            grid-area: 1/2/3/4;

        }

        .div3{
            grid-area: 1/4/2/5;


        }


        .div4{
            grid-area: 2/4/3/5;

        }

        .div5{
            grid-area: 3/1/5/3;

        }


        .div6{
            grid-area: 4/3/5/5;


        }

        .div7{
            grid-area: 3/3/4/5;


        }


    </style>



</head>
<body>
<!--    <div class="contenedor">-->
<!--&lt;!&ndash;        <div class="caja-basica">1</div>&ndash;&gt;-->
<!--&lt;!&ndash;        <div class="caja-basica">2</div>&ndash;&gt;-->
<!--&lt;!&ndash;        <div class="caja-basica">3</div>&ndash;&gt;-->
<!--&lt;!&ndash;        <div class="caja-basica">4</div>&ndash;&gt;-->
<!--&lt;!&ndash;        <div class="caja-basica">5</div>&ndash;&gt;-->
<!--&lt;!&ndash;        <div class="caja-basica">6</div>&ndash;&gt;-->
<!--    </div>-->

    <div class="parent">
        <div class="div1"> 1 </div>
        <div class="div2"> 2 </div>
        <div class="div3"> 3 </div>
        <div class="div4"> 4 </div>
        <div class="div5"> 5 </div>
        <div class="div6"> 6 </div>
        <div class="div7"> 7 </div>
    </div>


</body>
</html>
