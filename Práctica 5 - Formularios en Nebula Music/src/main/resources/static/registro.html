<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nébula Music - Registro</title>
    <link rel="stylesheet" href="./styles/styles.css">
</head>
<body>

    <main class="auth-container">
        <section class="auth-card">
            
            <!-- TAREA PARA EL ALUMNO:
                 Crea un formulario que envíe los datos mediante POST a "/crear-cuenta".
                 Debe contener campos para:
                 - Nombre completo (texto)
                 - Correo electrónico (email)
                 - Contraseña (password)
                 - Pseudónimo (texto con patrón de validación: [letras de 3 a 10]-[números de 2 a 10])
                 - Género (radio buttons: Femenino, Masculino, Otro)
                 - Tipo de Suscripción (select: Gratis, Premium Mensual, Premium Anual)
                 - Fecha de nacimiento (date)
                 - Aceptar términos y condiciones (checkbox)
                 - Comentarios adicionales o gustos (textarea)
            -->
            <form class="auth-form" method="post" action="/crear-cuenta" enctype="application/x-www-form-urlencoded">
                <!-- Escribe tus etiquetas (label) e inputs aquí -->
                <h2>Crear Cuenta</h2>
                <div>
                    <label for="nombre"> Nombre Completo:</label>
                    <input
                        type="text"
                        id="nombre"
                        name="nombre"
                        placeholder="ej. Roberto"
                        required
                        minlength="3"
                        maxlength="80"

                    >
                </div>


                <div>
                    <label for="Correo"> Correo Electronico:</label>
                    <input
                            type="email"
                            id="Correo"
                            name="Correo"
                            placeholder="hola@ejemplo.com"
                            required
                            minlength="10"
                            maxlength="80"

                    >
                </div>

                <div>
                    <label for="contrasenia"> Contrasenia:</label>
                    <input
                            type="password"
                            id="contrasenia"
                            name="contrasenia"
                            placeholder="minimo 8"
                            required
                            minlength="8"
                            maxlength="80"
                            autocomplete="off"
                    >
                </div>


                <div>
                    <label for="pseudonimo"> Pseudonimo:</label>
                    <input
                            type="text"
                            id="pseudonimo"
                            name="pseudonimo"

                            required
                            pattern="[a-z A-Z]{3,10} - [0-9]{2,10}"
                            placeholder="Nebula2025"
                            minlength="6"

                    >
                </div>
                <label> Genero:</label>
                <input
                        type="radio"
                        id="radio_femenino"
                        name="genero"
                        value="Femenino"

                        required

                >
                <label for="radio_femenino">Femenino</label>
                <input
                        type="radio"
                        id="radio_masculino"
                        name="genero"
                        value="Masculino"
                >
                <label for="radio_masculino">Masculino</label>

                <input
                        type="radio"
                        id="radio_machete"
                        name="genero"
                        value="Machete"
                >
                <label for="radio_machete">Machete</label>


                <div>
                    <label for="suscripcion">Tipo de Suscripcion</label>
                    <select id="suscripcion" name="suscrpcion" required>
                        <option value="">------Seleccione una opcion-----------</option>
                        <option value="Gratis">Gratis con Anuncios</option>
                        <option value="PremiumManual">Premium Mensual</option>
                        <option value="PremiunAnual">Premium Anual</option>

                    </select>
                </div>


                <div>
                    <label for="fechaNacimiento">Fecha de Nacimiento</label>
                    <input
                        type="date"
                        id="fechaNacimiento"
                        name="fechaNacimiento"
                        required
                    >

                </div>


                <div>
                    <input type="checkbox" id="terminos" value="aceptado" required>
                    <label for="terminos">Acepto los terminos y condiciones de uso</label>


                </div>

                <div>
                    <label for="comentarios">Comentarios o Gustos</label>
                    <textarea
                            id="comentarios"
                            name="comentarios"
                            rows="4"
                            cols="40"
                            placeholder="Cuentanos tu opinion"
                    >



                    </textarea>


                </div>


            </form>
            <div>
                <button type="submit">
                    Registrarse
                </button>
                <button type="reset">
                    Limpiar Formulario
                </button>




        </section>
    </main>

    <footer>
        <p>Copyright Nébula 2025.</p>
    </footer>

</body>
</html>
